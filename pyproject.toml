[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "allelign"
dynamic = ["version"]
description = "Read, align and quality-control GWAS summary statistics and PGS weights"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bvilhjal" }]
dependencies = ["numpy>=1.20"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/bvilhjal/allelign"
Repository = "https://github.com/bvilhjal/allelign"
Issues = "https://github.com/bvilhjal/allelign/issues"
Documentation = "https://github.com/bvilhjal/allelign/blob/main/docs/guide.md"

[project.optional-dependencies]
fast = ["numba>=0.59", "scipy>=1.7"]
test = ["pytest>=7", "scipy>=1.7"]
lint = ["ruff>=0.5"]

[project.scripts]
allelign = "allelign.cli:main"

[tool.setuptools]
packages = ["allelign"]

[tool.setuptools.dynamic]
version = { attr = "allelign.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavier simulation test",
    "parity: compares against ldpred3 (skipped when ldpred3 is not installed)",
    "numba: exercises the Numba parser path",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
