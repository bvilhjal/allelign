name: Publish to PyPI

# Trusted publishing: create the "allelign" project on PyPI once and register
# this workflow as a trusted publisher there (repository bvilhjal/allelign,
# environment "pypi", workflow file .github/workflows/pypi.yml). Until then
# this workflow only runs when a GitHub release is published.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
