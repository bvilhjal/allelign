name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[lint]"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor ldpred3's own CI tests: py3.9 with numpy 1.20, no Numba.
          - python-version: "3.9"
            extras: "test"
            pins: "numpy==1.20.3"
          - python-version: "3.12"
            extras: "test,fast"
            pins: ""
    name: py${{ matrix.python-version }} · ${{ matrix.extras }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[${{ matrix.extras }}]" ${{ matrix.pins }}
      # The parity tests skip themselves without ldpred3, which is private;
      # they run locally against the sibling checkout.
      - run: pytest -q
